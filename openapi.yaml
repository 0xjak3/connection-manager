openapi: 3.0.3
info:
  title: connection_manager API
  version: 0.1.0
  description: |
    HTTP API of connection_manager. Every error response uses the `ErrorResponse`
    envelope. Error codes:

    - `invalid_request` (400): the request shape is wrong (malformed JSON, missing or
      unsupported Content-Type, field validation failed).
    - `http_error`: a transport-level error with its own status (e.g. 400 `invalid id`).
    - `validation_error` (400): the business rules rejected the request.
    - `not_found` (404), `conflict` (409), `invalid_state` (409), `forbidden` (403).
    - `internal_error` (500): unexpected failure; the message is generic.

tags:
  - name: health
  - name: users

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness check
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/users:
    post:
      operationId: createUser
      tags: [users]
      summary: Sign up a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: |
            `invalid_request`: malformed JSON, missing/unsupported Content-Type, or field
            validation failed (missing email/password, bad email format, password length).
            `validation_error`: the password is longer than 72 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`conflict`: the email is already taken (`conflict: email already taken`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`internal_error`: unexpected failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "500":
          description: "`internal_error`: unexpected failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      tags: [users]
      summary: Fetch a user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "`http_error`: the id is not a UUID (`invalid id`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`not_found`: no user with this id (`user not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`internal_error`: unexpected failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user's email and/or password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: |
            `http_error`: the id is not a UUID (`invalid id`).
            `invalid_request`: malformed JSON, missing/unsupported Content-Type, neither
            field present, bad email format, or password length.
            `validation_error`: the password is longer than 72 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`not_found`: no user with this id (`user not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`conflict`: the email is taken by another user (`conflict: email already taken`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`internal_error`: unexpected failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      responses:
        "204":
          description: User deleted. No body.
        "400":
          description: "`http_error`: the id is not a UUID (`invalid id`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`not_found`: no user with this id (`user not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "`internal_error`: unexpected failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: User id (UUID v7).
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: |
            A valid email address once surrounding whitespace is removed. Stored trimmed
            and lowercased. Unique (case-insensitive).
          minLength: 1
          x-oapi-codegen-extra-tags:
            validate: "required,trimmed_email"
        password:
          type: string
          description: 8 to 72 characters, and at most 72 bytes in UTF-8. Never returned.
          minLength: 8
          maxLength: 72
          x-oapi-codegen-extra-tags:
            validate: "required,min=8,max=72"

    UpdateUserRequest:
      type: object
      description: |
        Partial update. At least one of `email` and `password` is required.
        A field sent as `null` counts as absent, so it does not satisfy
        "at least one field" (`{"email": null}` is rejected like `{}`).
      minProperties: 1
      properties:
        email:
          type: string
          description: |
            A valid email address once surrounding whitespace is removed. Stored trimmed
            and lowercased. Unique (case-insensitive).
          x-oapi-codegen-extra-tags:
            validate: "required_without=Password,omitnil,trimmed_email"
        password:
          type: string
          description: 8 to 72 characters, and at most 72 bytes in UTF-8. Never returned.
          minLength: 8
          maxLength: 72
          x-oapi-codegen-extra-tags:
            validate: "required_without=Email,omitnil,min=8,max=72"

    User:
      type: object
      additionalProperties: false
      required: [id, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Trimmed, lowercased email.
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.

    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    UserListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - http_error
            - validation_error
            - not_found
            - conflict
            - invalid_state
            - forbidden
            - internal_error
        message:
          type: string
